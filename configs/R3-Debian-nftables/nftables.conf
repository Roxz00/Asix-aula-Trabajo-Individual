#!/usr/sbin/nft -f
# /etc/nftables.conf · R3-Debian-nftables · Grupo 3
# WAN = enp0s3 (NAT VirtualBox) · LAN = enp0s8 (192.168.30.0/24)

flush ruleset

define WAN = "enp0s3"
define LAN = "enp0s8"
define RED_LAN = 192.168.30.0/24
define DNS_EMPRESA = 172.16.222.1

table inet filtro {
    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept      # respuestas a conexiones propias
        ct state invalid drop
        iif "lo" accept
        ip protocol icmp accept                   # ping para diagnóstico
        tcp dport 22 accept comment "SSH (LAN y gestión desde el anfitrión por NAT)"
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept      # respuestas de Internet hacia la LAN
        ct state invalid drop
        # Conexión bloqueada (Tasca 5): la LAN solo puede usar el DNS de la empresa
        iifname $LAN ip daddr != $DNS_EMPRESA meta l4proto { tcp, udp } th dport 53 \
            log prefix "R3-BLOQ-DNS-EXT " level warn drop comment "DNS externo bloqueado"
        # Conexión permitida que se registra (Tasca 5): web sin cifrar
        iifname $LAN oifname $WAN ip saddr $RED_LAN tcp dport 80 ct state new \
            log prefix "R3-PERMITE-HTTP " level info accept comment "HTTP permitido y registrado"
        iifname $LAN oifname $WAN ip saddr $RED_LAN accept comment "LAN -> Internet"
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname $WAN ip saddr $RED_LAN masquerade comment "NAT LAN -> WAN"
    }
}
